<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Portarretrato</title>
<!--
  PORTARRETRATO CON CALENDARIO DEL MES
  - Toca la pantalla > "Agregar fotos" y elige fotos de la galería. Se guardan dentro de la página
    (reducidas y ya giradas), así que siguen ahí aunque reinicies la tablet. No necesita internet.
  - Opcional: Google Calendar con Codigo.gs (pon URL_SCRIPT y CLAVE) para marcar días con eventos.
  - JavaScript ES5 y sin librerías, pensado para la Galaxy Tab 2.
-->
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  body { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; color:#fff;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }

  #app { position:absolute; top:0; left:0; right:0; bottom:0; box-sizing:border-box; padding:4vh 3vw;
    display:-webkit-box; display:-webkit-flex; display:flex; }

  /* ---- Calendario ---- */
  #cal { -webkit-flex:0 0 50%; flex:0 0 50%; box-sizing:border-box; padding-right:3vw;
    display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; }
  #cab { display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-pack:justify; -webkit-justify-content:space-between; justify-content:space-between;
    font-size:8vh; font-weight:500; line-height:1; margin:1vh 0 3vh; }
  #mes { text-transform:capitalize; }
  #rejilla { width:100%; -webkit-flex:1; flex:1; border-collapse:collapse; table-layout:fixed; }
  #rejilla th { font-size:4.6vh; font-weight:700; padding-bottom:1.5vh; }
  #rejilla td { text-align:center; font-size:4.6vh; font-weight:500; padding:0; }
  .finde { color:#ff4b4b; }
  .num { position:relative; display:inline-block; width:1.75em; height:1.75em; line-height:1.75em; border-radius:50%; }
  .hoy .num { background:#e53935; color:#fff; }
  .evento .num:after { content:''; position:absolute; left:50%; bottom:0.1em; width:0.22em; height:0.22em; margin-left:-0.11em;
    border-radius:50%; background:#8ab4f8; }
  .hoy.evento .num:after { background:#fff; }

  /* ---- Foto y reloj ---- */
  #der { -webkit-box-flex:1; -webkit-flex:1; flex:1; min-width:0;
    display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; }
  #marco { position:relative; -webkit-box-flex:1; -webkit-flex:1; flex:1; min-height:0; overflow:hidden; background:#000; border-radius:4px; }
  .foto { position:absolute; top:0; left:0; right:0; bottom:0; background-position:center center; background-repeat:no-repeat;
    background-size:cover; opacity:0; -webkit-transition:opacity 1.2s ease-in-out; transition:opacity 1.2s ease-in-out; }
  .foto.visible { opacity:1; }
  body.completa .foto { background-size:contain; }
  #vacio { position:absolute; top:0; left:0; right:0; bottom:0; display:none; text-align:center; font-size:3.4vh; line-height:1.4;
    color:#aaa; padding:12% 8%; box-sizing:border-box; }

  #reloj { margin-top:4vh; border-top:0.6vh solid #e6e6e6; border-bottom:0.6vh solid #e6e6e6; padding:1.5vh 0 1vh;
    display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-align:end; -webkit-align-items:flex-end; align-items:flex-end;
    -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center; }
  #ampm { font-size:4vh; font-weight:700; margin-right:1.5vw; padding-bottom:1.2vh; }
  #hms { font-family:"Roboto Mono","Droid Sans Mono","DejaVu Sans Mono",monospace; font-weight:700; font-size:14vh; line-height:1; letter-spacing:-0.03em; }
  #pie { margin-top:1.2vh; min-height:3.6vh; display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-align:center; -webkit-align-items:center; align-items:center; }
  #prox { -webkit-box-flex:1; -webkit-flex:1; flex:1; min-width:0; font-size:3vh; color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bat { display:none; -webkit-flex:none; flex:none; margin-left:2vw; font-size:3vh; font-weight:700; color:#ddd;
    -webkit-box-align:center; -webkit-align-items:center; align-items:center; }
  #bat.on { display:-webkit-box; display:-webkit-flex; display:flex; }
  #bat svg { display:block; height:1.15em; }
  #batIcono { width:2.3em; margin-right:0.35em; }
  #bat #batRayo { width:0.7em; margin-right:0.15em; display:none; }
  #bat.carga #batRayo { display:block; }
  #bat.carga { color:#66d17a; }
  #bat.media { color:#ffb300; }
  #bat.baja { color:#ff4b4b; }

  /* ---- Modo noche y panel de ajustes ---- */
  #noche { position:absolute; top:0; left:0; right:0; bottom:0; background:#000; opacity:0; pointer-events:none; z-index:5;
    -webkit-transition:opacity 3s; transition:opacity 3s; }
  #noche.activa { opacity:0.8; }
  #panel { position:absolute; left:0; right:0; bottom:0; z-index:10; display:none; background:rgba(20,20,20,0.95);
    padding:2.5vh 3vw; font-size:3.2vh; text-align:center; }
  #panel.abierto { display:block; }
  #panel .info { margin-bottom:2vh; color:#ccc; }
  .boton { display:inline-block; margin:0.8vh 0.8vw; padding:1.6vh 2.6vw; border-radius:1vh; background:#333; color:#fff;
    font-size:3.2vh; border:0; font-family:inherit; cursor:pointer; }
  .boton.principal { background:#1e88e5; }
  .boton.peligro { background:#8e2424; }
  #archivo { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }

  @media (orientation: portrait) {
    #app { -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; padding:3vh 5vw; }
    #cal { -webkit-flex:none; flex:none; padding-right:0; margin-bottom:2vh; }
    #cab { font-size:5vh; }
    #rejilla th, #rejilla td { font-size:3vh; }
    #hms { font-size:9vh; } #ampm { font-size:2.6vh; } #prox { font-size:2.2vh; }
    #reloj { margin-top:2vh; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="cal">
    <div id="cab"><span id="mes"></span><span id="anio"></span></div>
    <table id="rejilla"></table>
  </div>
  <div id="der">
    <div id="marco">
      <div id="fotoA" class="foto"></div>
      <div id="fotoB" class="foto"></div>
      <div id="vacio">Toca la pantalla y elige<br><b>Agregar fotos</b><br>para escogerlas de la galería.</div>
    </div>
    <div id="reloj"><span id="ampm"></span><span id="hms"></span></div>
    <div id="pie">
      <div id="prox"></div>
      <div id="bat">
        <svg id="batRayo" viewBox="0 0 10 16"><path d="M6.5 0 L0.5 9 H4.5 L3.5 16 L9.5 7 H5.5 Z" fill="currentColor"/></svg>
        <svg id="batIcono" viewBox="0 0 30 15">
          <rect x="0.9" y="0.9" width="25" height="13.2" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <rect x="27" y="4.6" width="2.6" height="5.8" rx="1" fill="currentColor"/>
          <rect id="batNivel" x="3" y="3" width="20.8" height="9" rx="1.2" fill="currentColor"/>
        </svg>
        <span id="batPct"></span>
      </div>
    </div>
  </div>
</div>
<div id="noche"></div>
<div id="panel">
  <div class="info" id="info">0 fotos guardadas</div>
  <label for="archivo" class="boton principal">Agregar fotos</label>
  <button class="boton" id="quitar">Quitar esta foto</button>
  <button class="boton peligro" id="borrar">Borrar todas</button>
  <button class="boton" id="cerrar">Cerrar</button>
  <input type="file" id="archivo" accept="image/*" multiple>
</div>

<script>
(function () {
  'use strict';

  /* ====================== CONFIGURACIÓN ====================== */
  var CONFIG = {
    SEGUNDOS_POR_FOTO: 20,
    AJUSTE_FOTO: 'contain',   // 'contain' = foto completa; 'cover' = llena el recuadro recortando bordes
    FORMATO_24H: false,
    MOSTRAR_SEGUNDOS: true,
    LUNES_PRIMERO: false,     // true = la semana empieza el lunes
    TAMANO_MAX: 1280,         // tamaño (px) al que se reducen las fotos al guardarlas
    NOCHE_DESDE: 23,          // atenúa la pantalla desde esta hora...
    NOCHE_HASTA: 6,           // ...hasta esta. Pon -1 en ambas para desactivar.
    FOTOS_LOCALES: [],        // opcional: rutas junto a este archivo, ej. ['fotos/1.jpg']
    URL_SCRIPT: '',           // opcional: URL de Codigo.gs (Google Calendar), termina en /exec
    CLAVE: 'cambia-esta-clave',
    MINUTOS_ACTUALIZAR: 15
  };
  /* =========================================================== */

  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
               'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var DIA_MS = 86400000;

  function $(id) { return document.getElementById(id); }
  function dos(n) { return n < 10 ? '0' + n : '' + n; }
  function inicioDelDia(t) { var d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function guardarLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function leerLS(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

  /* ---------------- Calendario del mes ---------------- */
  var eventos = [];
  function diasConEventos() {
    var m = {}, ahora = Date.now();
    for (var i = 0; i < eventos.length; i++) {
      var e = eventos[i];
      if ((e.end || e.start) <= ahora) continue;
      var t = inicioDelDia(Math.max(e.start, inicioDelDia(ahora)));
      var fin = e.end || e.start;
      // los eventos de varios días marcan cada día (máximo 31)
      for (var n = 0; n < 31 && t < fin; n++) { m[t] = true; t = inicioDelDia(t + DIA_MS + 3600000); }
      if (n === 0) m[t] = true;
    }
    return m;
  }
  function pintarMes() {
    var hoy = new Date(), y = hoy.getFullYear(), mes = hoy.getMonth();
    $('mes').textContent = MESES[mes];
    $('anio').textContent = y;
    var cab = CONFIG.LUNES_PRIMERO ? ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'] : ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    var html = '<tr>', i;
    for (i = 0; i < 7; i++) html += '<th' + (cab[i] === 'Dom' || cab[i] === 'Sáb' ? ' class="finde"' : '') + '>' + cab[i] + '</th>';
    html += '</tr>';
    var desfase = new Date(y, mes, 1).getDay();
    if (CONFIG.LUNES_PRIMERO) desfase = (desfase + 6) % 7;
    var diasMes = new Date(y, mes + 1, 0).getDate();
    var celdas = Math.ceil((desfase + diasMes) / 7) * 7;
    var marcas = diasConEventos();
    for (i = 0; i < celdas; i++) {
      if (i % 7 === 0) html += '<tr>';
      var d = i - desfase + 1;
      if (d < 1 || d > diasMes) html += '<td></td>';
      else {
        var fecha = new Date(y, mes, d), dow = fecha.getDay(), cls = [];
        if (dow === 0 || dow === 6) cls.push('finde');
        if (d === hoy.getDate()) cls.push('hoy');
        if (marcas[fecha.getTime()]) cls.push('evento');
        html += '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '><span class="num">' + d + '</span></td>';
      }
      if (i % 7 === 6) html += '</tr>';
    }
    $('rejilla').innerHTML = html;
  }
  function horaCorta(t) {
    var d = new Date(t), h = d.getHours(), m = dos(d.getMinutes());
    if (CONFIG.FORMATO_24H) return h + ':' + m;
    return (h % 12 || 12) + ':' + m + (h >= 12 ? ' pm' : ' am');
  }
  function pintarProximo() {
    var ahora = Date.now(), hoy = inicioDelDia(ahora), prox = null;
    for (var i = 0; i < eventos.length; i++) {
      var e = eventos[i];
      if ((e.end || e.start) <= ahora) continue;
      if (!prox || Math.max(e.start, hoy) < Math.max(prox.start, hoy) ||
          (Math.max(e.start, hoy) === Math.max(prox.start, hoy) && e.allDay && !prox.allDay)) prox = e;
    }
    if (!prox) { $('prox').textContent = ''; return; }
    var dia = inicioDelDia(Math.max(prox.start, hoy)), dif = Math.round((dia - hoy) / DIA_MS), cuando;
    cuando = dif === 0 ? 'Hoy' : dif === 1 ? 'Mañana' : DIAS[new Date(dia).getDay()] + ' ' + new Date(dia).getDate();
    if (!prox.allDay && prox.start >= hoy) cuando += ' ' + horaCorta(prox.start);
    $('prox').textContent = cuando.charAt(0).toUpperCase() + cuando.slice(1) + ' · ' + prox.title;
  }

  /* ---------------- Reloj y modo noche ---------------- */
  var fechaPintada = -1, minutoAnterior = -1, arranque = Date.now();
  function revisarNoche(h) {
    var a = CONFIG.NOCHE_DESDE, b = CONFIG.NOCHE_HASTA, on = false;
    if (a >= 0 && b >= 0 && a !== b) on = a < b ? (h >= a && h < b) : (h >= a || h < b);
    $('noche').className = on ? 'activa' : '';
  }
  function tic() {
    var d = new Date(), h = d.getHours(), txt;
    if (CONFIG.FORMATO_24H) { txt = dos(h); $('ampm').textContent = ''; }
    else { txt = dos(h % 12 || 12); $('ampm').textContent = h >= 12 ? 'PM' : 'AM'; }
    txt += ':' + dos(d.getMinutes());
    if (CONFIG.MOSTRAR_SEGUNDOS) txt += ':' + dos(d.getSeconds());
    $('hms').textContent = txt;
    if (d.getDate() !== fechaPintada) { fechaPintada = d.getDate(); pintarMes(); }
    if (d.getMinutes() !== minutoAnterior) {
      minutoAnterior = d.getMinutes();
      revisarNoche(h);
      pintarProximo();
      // recarga diaria a las 4 a. m. para liberar memoria en equipos viejos
      if (h === 4 && d.getMinutes() === 0 && Date.now() - arranque > 3600000) location.reload();
    }
  }

  /* ---------------- Almacén de fotos (IndexedDB) ---------------- */
  var db = null;
  function abrirDB(cb) {
    try {
      var idb = window.indexedDB || window.webkitIndexedDB;
      if (!idb) { cb(); return; }
      var rq = idb.open('portarretrato', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('fotos', { autoIncrement: true }); };
      rq.onsuccess = function () { db = rq.result; cb(); };
      rq.onerror = function () { cb(); };
    } catch (e) { cb(); }
  }
  function tienda(modo) { return db.transaction('fotos', modo).objectStore('fotos'); }
  function clavesGuardadas(cb) {
    if (!db) { cb([]); return; }
    var claves = [], st = tienda('readonly');
    var rq = st.openKeyCursor ? st.openKeyCursor() : st.openCursor();
    rq.onsuccess = function () { var c = rq.result; if (c) { claves.push(c.key); c['continue'](); } else cb(claves); };
    rq.onerror = function () { cb(claves); };
  }
  function leerFoto(clave, cb) {
    var rq = tienda('readonly').get(clave);
    rq.onsuccess = function () { cb(rq.result || null); };
    rq.onerror = function () { cb(null); };
  }
  function guardarFoto(datos, cb) {
    var rq = tienda('readwrite').add(datos);
    rq.onsuccess = function () { cb(rq.result); };
    rq.onerror = function () { cb(null); };
  }

  /* ---------------- Importar fotos de la galería ---------------- */
  var autoGira = 'imageOrientation' in document.documentElement.style; // navegadores nuevos ya respetan la rotación EXIF
  function orientacionExif(v) {
    if (v.getUint16(0) !== 0xFFD8) return 1;
    var off = 2;
    while (off < v.byteLength - 4) {
      var marca = v.getUint16(off); off += 2;
      if (marca === 0xFFE1) {
        if (v.getUint32(off + 2) !== 0x45786966) return 1;
        var tiff = off + 8, le = v.getUint16(tiff) === 0x4949;
        var ifd = tiff + v.getUint32(tiff + 4, le), n = v.getUint16(ifd, le);
        for (var i = 0; i < n; i++) {
          var e = ifd + 2 + i * 12;
          if (v.getUint16(e, le) === 0x0112) return v.getUint16(e + 8, le);
        }
        return 1;
      } else if ((marca & 0xFF00) !== 0xFF00) break;
      else off += v.getUint16(off);
    }
    return 1;
  }
  function leerOrientacion(archivo, cb) {
    if (autoGira || !window.FileReader || !window.DataView) { cb(1); return; }
    var r = new FileReader();
    r.onload = function () { var o = 1; try { o = orientacionExif(new DataView(r.result)); } catch (e) {} cb(o); };
    r.onerror = function () { cb(1); };
    r.readAsArrayBuffer(archivo.slice(0, 131072));
  }
  function reducir(img, o) {
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var esc = Math.min(1, CONFIG.TAMANO_MAX / Math.max(w, h));
    var dw = Math.round(w * esc), dh = Math.round(h * esc), gira = o >= 5 && o <= 8;
    var c = document.createElement('canvas');
    c.width = gira ? dh : dw; c.height = gira ? dw : dh;
    var x = c.getContext('2d');
    switch (o) {
      case 2: x.transform(-1, 0, 0, 1, dw, 0); break;
      case 3: x.transform(-1, 0, 0, -1, dw, dh); break;
      case 4: x.transform(1, 0, 0, -1, 0, dh); break;
      case 5: x.transform(0, 1, 1, 0, 0, 0); break;
      case 6: x.transform(0, 1, -1, 0, dh, 0); break;
      case 7: x.transform(0, -1, -1, 0, dh, dw); break;
      case 8: x.transform(0, -1, 1, 0, 0, dw); break;
    }
    x.drawImage(img, 0, 0, dw, dh);
    return c.toDataURL('image/jpeg', 0.85);
  }
  function importar(archivos) {
    var lista = [], i, hechas = 0, fallidas = 0;
    for (i = 0; i < archivos.length; i++) if (/^image\//.test(archivos[i].type)) lista.push(archivos[i]);
    if (!lista.length) return;
    if (!db) { info('Este navegador no permite guardar fotos. Prueba con Chrome o Fully Kiosk.'); return; }
    var URLx = window.URL || window.webkitURL;
    function siguiente() {
      if (!lista.length) {
        info((hechas ? 'Listo: ' + hechas + ' foto' + (hechas === 1 ? '' : 's') + ' agregada' + (hechas === 1 ? '' : 's') + '. ' : '') +
             (fallidas ? fallidas + ' no se pudieron leer. ' : '') + totalTexto());
        botonesPanel();
        mantenerPanel();
        return;
      }
      var archivo = lista.shift();
      info('Guardando ' + (hechas + fallidas + 1) + ' de ' + (hechas + fallidas + lista.length + 1) + '…');
      mantenerPanel();
      leerOrientacion(archivo, function (o) {
        var url = URLx.createObjectURL(archivo), img = new Image();
        img.onload = function () {
          var datos = null;
          try { datos = reducir(img, o); } catch (e) {}
          URLx.revokeObjectURL(url);
          if (!datos) { fallidas++; siguiente(); return; }
          guardarFoto(datos, function (clave) {
            if (clave === null) fallidas++;
            else { hechas++; fotos.push({ clave: clave }); cola.push({ clave: clave }); if (!capaVisible) siguienteFoto(0); }
            actualizarVacio();
            setTimeout(siguiente, 30);
          });
        };
        img.onerror = function () { URLx.revokeObjectURL(url); fallidas++; siguiente(); };
        img.src = url;
      });
    }
    siguiente();
  }

  /* ---------------- Presentación de fotos ---------------- */
  var capas = [$('fotoA'), $('fotoB')], capaVisible = null, fotos = [], cola = [], actual = null, tFoto = null;
  function barajar(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function actualizarVacio() { $('vacio').style.display = fotos.length ? 'none' : 'block'; }
  function mostrar(src, f) {
    var oculta = capaVisible === capas[0] ? capas[1] : capas[0];
    oculta.style.backgroundImage = 'url("' + src.replace(/"/g, '%22') + '")';
    void oculta.offsetWidth;
    oculta.className = 'foto visible';
    if (capaVisible) capaVisible.className = 'foto';
    capaVisible = oculta;
    actual = f;
    tFoto = setTimeout(function () { siguienteFoto(0); }, CONFIG.SEGUNDOS_POR_FOTO * 1000);
  }
  function siguienteFoto(intentos) {
    clearTimeout(tFoto);
    if (!fotos.length) {
      for (var k = 0; k < 2; k++) { capas[k].className = 'foto'; capas[k].style.backgroundImage = ''; }
      capaVisible = null; actual = null; actualizarVacio();
      return;
    }
    if (intentos >= Math.min(fotos.length, 5)) { tFoto = setTimeout(function () { siguienteFoto(0); }, 60000); return; }
    if (!cola.length) cola = barajar(fotos);
    var f = cola.shift();
    function cargar(src) {
      if (!src) { siguienteFoto(intentos + 1); return; }
      var img = new Image(), usoAlt = false;
      img.onload = function () { mostrar(img.src, f); };
      img.onerror = function () {
        if (f.alt && !usoAlt) { usoAlt = true; img.src = f.alt; }
        else siguienteFoto(intentos + 1);
      };
      img.src = src;
    }
    if (f.clave !== undefined) leerFoto(f.clave, cargar);
    else cargar(f.src);
  }
  function quitarDeListas(f) {
    function filtra(a) { var r = []; for (var i = 0; i < a.length; i++) if (a[i].clave !== f.clave || a[i].src !== f.src) r.push(a[i]); return r; }
    fotos = filtra(fotos); cola = filtra(cola);
  }

  /* ---------------- Panel de ajustes ---------------- */
  var tPanel = null;
  function totalTexto() {
    var n = 0; for (var i = 0; i < fotos.length; i++) if (fotos[i].clave !== undefined) n++;
    return n + ' foto' + (n === 1 ? '' : 's') + ' guardada' + (n === 1 ? '' : 's') + ' en la tablet.';
  }
  function info(t) { $('info').textContent = t; }
  function mantenerPanel() { clearTimeout(tPanel); tPanel = setTimeout(cerrarPanel, 20000); }
  function botonesPanel() {
    $('quitar').style.display = actual && actual.clave !== undefined ? 'inline-block' : 'none';
    $('borrar').style.display = fotos.length ? 'inline-block' : 'none';
  }
  function abrirPanel() {
    info(totalTexto());
    botonesPanel();
    $('panel').className = 'abierto';
    mantenerPanel();
  }
  function cerrarPanel() { clearTimeout(tPanel); $('panel').className = ''; }

  $('app').addEventListener('click', function () {
    var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) { try { f.call(el); } catch (e) {} }
    if ($('panel').className) cerrarPanel(); else abrirPanel();
  });
  $('panel').addEventListener('click', function (ev) { ev.stopPropagation(); mantenerPanel(); });
  $('cerrar').addEventListener('click', cerrarPanel);
  $('archivo').addEventListener('change', function () {
    var a = this.files; if (a && a.length) importar(a);
    try { this.value = ''; } catch (e) {}
  });
  $('quitar').addEventListener('click', function () {
    if (!actual || actual.clave === undefined || !db) return;
    if (!window.confirm('¿Quitar esta foto del portarretrato?')) return;
    var f = actual;
    var rq = tienda('readwrite')['delete'](f.clave);
    rq.onsuccess = function () { quitarDeListas(f); siguienteFoto(0); abrirPanel(); info('Foto quitada. ' + totalTexto()); };
  });
  $('borrar').addEventListener('click', function () {
    if (!db || !window.confirm('¿Borrar todas las fotos guardadas en el portarretrato? Las de la galería no se tocan.')) return;
    var rq = tienda('readwrite').clear();
    rq.onsuccess = function () {
      var r = []; for (var i = 0; i < fotos.length; i++) if (fotos[i].clave === undefined) r.push(fotos[i]);
      fotos = r; cola = []; siguienteFoto(0); abrirPanel(); info('Fotos borradas.');
    };
  });

  /* ---------------- Google Calendar (opcional, vía Codigo.gs) ---------------- */
  function jsonp(url, ok, falla) {
    var nombre = 'pr_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    var s = document.createElement('script'), listo = false;
    function limpiar() { window[nombre] = function () {}; if (s.parentNode) s.parentNode.removeChild(s); }
    var t = setTimeout(function () { if (!listo) { listo = true; limpiar(); falla(); } }, 30000);
    window[nombre] = function (d) { if (listo) return; listo = true; clearTimeout(t); limpiar(); ok(d); };
    s.onerror = function () { if (listo) return; listo = true; clearTimeout(t); limpiar(); falla(); };
    s.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'callback=' + nombre + '&clave=' + encodeURIComponent(CONFIG.CLAVE) + '&_=' + Date.now();
    document.body.appendChild(s);
  }
  function aplicarDatos(d) {
    eventos = d.events || [];
    pintarMes(); pintarProximo();
    if (d.photos && d.photos.length) {
      var anchoFoto = Math.min(1600, Math.round(Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1)));
      var r = [];
      for (var i = 0; i < fotos.length; i++) if (!fotos[i].drive) r.push(fotos[i]);
      for (i = 0; i < d.photos.length; i++) {
        var id = encodeURIComponent(d.photos[i]);
        r.push({ drive: true, src: 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + anchoFoto,
                 alt: 'https://lh3.googleusercontent.com/d/' + id + '=w' + anchoFoto });
      }
      fotos = r; cola = [];
      actualizarVacio();
      if (!capaVisible) siguienteFoto(0);
    }
  }
  function actualizarDatos() {
    if (!CONFIG.URL_SCRIPT) return;
    jsonp(CONFIG.URL_SCRIPT, function (d) { if (d && !d.error) { guardarLS('pr_datos', d); aplicarDatos(d); } }, function () {});
  }

  /* ---------------- Indicador de batería ---------------- */
  function pintarBateria(nivel, cargando) {
    if (typeof nivel !== 'number' || isNaN(nivel)) return;
    nivel = Math.max(0, Math.min(1, nivel));
    var pct = Math.round(nivel * 100), cls = 'on';
    if (cargando) cls += ' carga';
    else if (pct <= 20) cls += ' baja';
    else if (pct <= 40) cls += ' media';
    $('bat').className = cls;
    $('batPct').textContent = pct + '%';
    $('batNivel').setAttribute('width', Math.max(0.8, 20.8 * nivel).toFixed(1));
  }
  function iniciarBateria() {
    function seguir(b) {
      function act() { pintarBateria(b.level, b.charging); }
      act();
      if (b.addEventListener) {
        b.addEventListener('levelchange', act);
        b.addEventListener('chargingchange', act);
      }
      setInterval(act, 60000);
    }
    function conFully() {
      // Fully Kiosk Browser (útil en Android 4.x): activa "Enable JavaScript Interface" en sus ajustes
      var f = window.fully;
      if (!f || !f.getBatteryLevel) return;
      function act() { try { pintarBateria(Number(f.getBatteryLevel()) / 100, f.isPlugged ? !!f.isPlugged() : false); } catch (e) {} }
      act();
      setInterval(act, 60000);
    }
    try {
      if (navigator.getBattery) {
        navigator.getBattery().then(seguir, conFully);
        return;
      }
      var vieja = navigator.battery || navigator.webkitBattery || navigator.mozBattery;
      if (vieja) { seguir(vieja); return; }
    } catch (e) {}
    conFully();
  }

  /* ---------------- Arranque ---------------- */
  iniciarBateria();
  if (CONFIG.AJUSTE_FOTO === 'contain') document.body.className = 'completa';
  tic();
  setInterval(tic, 1000);
  for (var i = 0; i < CONFIG.FOTOS_LOCALES.length; i++) fotos.push({ src: encodeURI(CONFIG.FOTOS_LOCALES[i]) });
  abrirDB(function () {
    clavesGuardadas(function (claves) {
      for (var j = 0; j < claves.length; j++) fotos.push({ clave: claves[j] });
      actualizarVacio();
      siguienteFoto(0);
      if (CONFIG.URL_SCRIPT) {
        var guardado = leerLS('pr_datos');
        if (guardado) aplicarDatos(guardado);
        actualizarDatos();
        setInterval(actualizarDatos, CONFIG.MINUTOS_ACTUALIZAR * 60000);
      }
    });
  });
})();
</script>
</body>
</html>
